name: Compilar RoadVerse 1.9.6 corregida (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoadVerse_Frontier_1_9_6_Corregida.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK plataforma
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extraer proyecto 1.9.6 corregido
        run: |
          test -f RoadVerse_Frontier_1_9_6_Corregida.zip || { echo "::error::Falta subir RoadVerse_Frontier_1_9_6_Corregida.zip a la raiz del repositorio"; exit 1; }
          mkdir -p extracted
          unzip -q RoadVerse_Frontier_1_9_6_Corregida.zip -d extracted
          test -f extracted/RoadVerse_Frontier_1_9_6_Corregida/settings.gradle.kts
      - name: Compilar APK debug
        working-directory: extracted/RoadVerse_Frontier_1_9_6_Corregida
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadVerse-1.9.6-corregida-debug
          path: extracted/RoadVerse_Frontier_1_9_6_Corregida/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
